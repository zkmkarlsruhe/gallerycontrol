# ANEL Runner Service
#
# Single container for ANEL power control via UDP.
# Uses host network for UDP broadcast access.
#
# Usage: docker compose up --build

services:
  anel-runner:
    build: .
    container_name: anel-runner
    network_mode: host

    environment:
      - TZ=Europe/Berlin
      - API_KEY=${API_KEY:-dev-api-key}
      - PORT=8001
      - LOG_LEVEL=DEBUG

    restart: unless-stopped
