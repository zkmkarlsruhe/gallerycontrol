<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ artwork_name }} - Display</title>
    <!-- CSS_VARIABLES -->
    <!-- BASE_CSS -->
    <style>
        /* Progress bar: Horizontal bar with text above */
        .display-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            gap: 2rem;
        }

        .artwork-name {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
        }

        .budget-display {
            font-size: 4rem;
            font-weight: 600;
            text-align: center;
        }

        .bar-container {
            width: 90%;
            max-width: 800px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: var(--available-color);
            transition: width 0.5s ease;
            border-radius: 12px;
        }

        .bar-fill.warning {
            background: var(--warning-color);
        }

        .bar-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 800px;
            opacity: 0.7;
            font-size: 1rem;
        }

        .reset-timer {
            margin-top: 1rem;
        }

        /* Warning overlay */
        .warning-overlay {
            flex-direction: column;
            text-align: center;
            padding: 3rem;
        }

        .warning-icon {
            font-size: 6rem;
            margin-bottom: 2rem;
        }

        .warning-text {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .warning-text.en {
            font-style: italic;
            opacity: 0.7;
            font-size: 1.5rem;
        }

        .cooldown-bar {
            width: 90%;
            max-width: 600px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 2rem;
            position: relative;
        }

        .cooldown-bar-fill {
            height: 100%;
            background: var(--warning-color);
            transition: width 0.5s ease;
        }

        .cooldown-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: 600;
        }
    </style>
    <!-- CUSTOM_CSS -->
</head>
<body>
    <div class="display-container">
        <h1 class="artwork-name">{{ artwork_name }}</h1>

        <div class="budget-display status-available" data-running-indicator>
            <span class="budget-value">--:--</span>
        </div>

        <div class="bar-container">
            <div class="bar-fill" style="width: 100%"></div>
            <div class="bar-label budget-percent">100%</div>
        </div>

        <div class="info-row">
            <span>0:00</span>
            <span class="budget-max">--:--</span>
        </div>

        <div class="reset-timer hidden"></div>
    </div>

    <!-- Warning Overlay -->
    <div class="warning-overlay">
        <div class="warning-icon">&#9888;</div>
        <div class="warning-text de">{{ warning_de }}</div>
        <div class="warning-text en">{{ warning_en }}</div>
        <div class="cooldown-bar">
            <div class="cooldown-bar-fill" id="cooldownBarFill"></div>
            <div class="cooldown-label cooldown-remaining"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/display/templates/d3.min.js"></script>
    <!-- SHARED_JS -->
    <script>
        // Progress bar specific updates
        document.addEventListener('display-status-update', function(e) {
            const status = e.detail;

            // Update progress bar
            const barFill = document.querySelector('.bar-fill');
            if (barFill) {
                barFill.style.width = status.budget_percent + '%';
                barFill.classList.toggle('warning', status.budget_percent < 20);
            }

            // Update cooldown bar if in cooldown
            if (status.cooldown_active && status.cooldown_remaining > 0) {
                const cooldownFill = document.getElementById('cooldownBarFill');
                if (cooldownFill) {
                    // Assuming typical cooldown of 2 minutes = 120 seconds
                    const maxCooldown = 120;
                    const percent = Math.min(100, (status.cooldown_remaining / maxCooldown) * 100);
                    cooldownFill.style.width = percent + '%';
                }
            }
        });
    </script>
</body>
</html>
