<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ artwork_name }} - Display</title>
    <!-- CSS_VARIABLES -->
    <!-- BASE_CSS -->
    <style>
        /* Chart-only: Centered chart with minimal text */
        .display-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .chart-container {
            width: 80%;
            max-width: 500px;
            aspect-ratio: 1;
        }

        .artwork-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .reset-timer {
            margin-top: 2rem;
        }

        /* Warning overlay */
        .warning-overlay {
            flex-direction: column;
            text-align: center;
        }

        .warning-icon {
            font-size: 8rem;
            margin-bottom: 2rem;
        }

        .warning-text {
            font-size: 2rem;
        }

        .cooldown-info {
            margin-top: 2rem;
            font-size: 3rem;
            font-weight: 600;
        }
    </style>
    <!-- CUSTOM_CSS -->
</head>
<body>
    <div class="display-container">
        <h1 class="artwork-name">{{ artwork_name }}</h1>
        <div class="chart-container"></div>
        <div class="reset-timer hidden"></div>
    </div>

    <!-- Warning Overlay -->
    <div class="warning-overlay">
        <div class="warning-icon">&#9888;</div>
        <div class="warning-text">{{ warning_de }}</div>
        <div class="cooldown-info">
            <span class="cooldown-remaining"></span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/display/templates/d3.min.js"></script>
    <!-- SHARED_JS -->
</body>
</html>
