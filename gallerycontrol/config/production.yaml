# Production configuration overrides for ZKM deployment
# These values override default.yaml when ENVIRONMENT=production

server:
  reload: false

logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "json"
  file: "/app/logs/gallerycontrol.log"

# Email configuration for ZKM internal network
# smtp.zkm.de does not require authentication from internal network
email:
  smtp_host: "mail.zkm.de"
  smtp_port: 25
  smtp_user: ""
  smtp_password: ""
  smtp_use_tls: false
  from_address: "steuerung@zkm.de"
  from_name: "GalleryControl"
  subject: "GalleryControl Device Status Report"
  recipients:
    - "museumstechnik@zkm.de"

# Hostname quick-generate templates for device forms
hostname_templates:
  netio: "netzwerksteckdose-netio-{num:03d}.zkm.de"
  anel: "netzwerksteckdose{num}.zkm.de"

# API settings
api:
  cors_origins:
    - "https://ctrl.mutech.zkm.de"
    - "https://steuerung.mutech.zkm.de"
