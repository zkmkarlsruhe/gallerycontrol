[tool.poetry]
name = "gallerycontrol"
version = "2.4.2"
description = "Museum device control system for daily operations"
authors = ["Marc Schütze @ ZKM | Center for Art and Media Karlsruhe"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.135.2"
uvicorn = {extras = ["standard"], version = "^0.42.0"}
sqlalchemy = "^2.0.48"
asyncpg = "^0.31.0"
alembic = "^1.18.4"
pydantic = "^2.12.0"
pydantic-settings = "^2.13.1"
httpx = "^0.28.1"
pyyaml = "^6.0"
python-dotenv = "^1.2.2"
watchdog = "^6.0.0"
aiosqlite = "^0.22.1"
croniter = "^6.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
black = "^26.0.0"
ruff = "^0.15.8"
mypy = "^1.19.0"
python-socks = {extras = ["asyncio"], version = "^2.8.1"}  # For remote dev SOCKS proxy
httpx-socks = "^0.11.0"  # For remote dev SOCKS proxy
pysocks = "^1.7.1"
requests = "^2.32.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    # Ignore RuntimeWarnings from mock coroutines that are never awaited
    # These occur when AsyncMock creates coroutines during test setup/teardown
    # Scoped to unittest.mock module to avoid hiding real async issues
    "ignore:coroutine .* was never awaited:RuntimeWarning:unittest.mock",
]
