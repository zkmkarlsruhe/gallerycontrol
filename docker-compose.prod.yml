version: "2.4"

services:

  mutech-control:
    build: ./mutech-control-service
    image: harbor.zkm.de/mutech/mutech-control:v1.2.3
    container_name: "mutech-control"
    restart: always
    cpus: "1.0"
    mem_limit: 1gb
    memswap_limit: 1gb

    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://mutech:${DB_PASSWORD}@mutech-postgres:5432/mutech

      # Application
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Email (defaults in production.yaml, can override here)
      - EMAIL_RECIPIENT=${EMAIL_RECIPIENT:-marc@zkm.de}

      # ANEL Runner (runs on docker-medmus.mutech.zkm.de)
      - ANEL_RUNNER_URL=http://docker-medmus.mutech.zkm.de:8001
      - ANEL_API_KEY=${ANEL_API_KEY:-changeme}

    volumes:
      - ./logs:/app/logs

    healthcheck:
      test: curl --fail http://localhost:8000/health || exit 1
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 10s

    depends_on:
      mutech-postgres:
        condition: service_healthy

    labels:
      # traefik
      - traefik.enable=true
      # Main router - protected by whitelist AND guardian auth
      - traefik.http.routers.mutech-control.rule=Host(`control.mutech.zkm.de`)
      - traefik.http.routers.mutech-control.entrypoints=websecure
      - traefik.http.routers.mutech-control.service=mutech-control
      - traefik.http.routers.mutech-control.tls=true
      - traefik.http.routers.mutech-control.middlewares=whitelist-and-guardian@file
      # External API router - only IP whitelist, no guardian auth (for /api/sensor and /api/fast)
      - traefik.http.routers.mutech-control-external.rule=Host(`control.mutech.zkm.de`) && (PathPrefix(`/api/sensor`) || PathPrefix(`/api/fast`))
      - traefik.http.routers.mutech-control-external.entrypoints=websecure
      - traefik.http.routers.mutech-control-external.service=mutech-control
      - traefik.http.routers.mutech-control-external.tls=true
      - traefik.http.routers.mutech-control-external.middlewares=zkm-intern-whitelist@file
      - traefik.http.routers.mutech-control-external.priority=100
      # Service
      - traefik.http.services.mutech-control.loadbalancer.server.port=8000

  mutech-postgres:
    image: postgres:16-alpine
    container_name: "mutech-postgres"
    restart: always
    cpus: "0.5"
    mem_limit: 512mb
    memswap_limit: 512mb

    environment:
      - POSTGRES_DB=mutech
      - POSTGRES_USER=mutech
      - POSTGRES_PASSWORD=${DB_PASSWORD}

    volumes:
      - mutech_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutech"]
      interval: 10s
      timeout: 5s
      retries: 5

    labels:
      # no traefik exposure
      - traefik.enable=false

volumes:
  mutech_postgres_data:
    driver: local

networks:
  default:
    external:
      name: traefik
