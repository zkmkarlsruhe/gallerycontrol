version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mutech-postgres
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: mutech
      POSTGRES_USER: mutech
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mutech_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutech"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
